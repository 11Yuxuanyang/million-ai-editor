<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>{{EDITORIAL_VARS}}</style>
    <style>{{SEQUENCE_STYLES}}</style>
  </head>
  <body>
    <main
      id="episode"
      data-composition-id="{{EPISODE_ID}}"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-fps="{{FPS}}"
    >
      <video id="a-roll-video" class="base-media" src="{{A_ROLL}}" muted playsinline data-start="0" data-duration="{{DURATION}}" data-track-index="0"></video>
      <audio id="a-roll-audio" src="{{A_ROLL}}" data-start="0" data-duration="{{DURATION}}" data-track-index="100" data-volume="1"></audio>

      <!-- AI-DIRECTED-SCENES -->
      {{SEQUENCE_SCENES}}
      {{CAPTIONS}}
    </main>

    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      {{CAPTION_TIMELINE}}
      // AI-DIRECTED-TIMELINE
      {{SEQUENCE_TIMELINE}}
      window.__timelines["{{EPISODE_ID}}"] = timeline;
    </script>
  </body>
</html>
